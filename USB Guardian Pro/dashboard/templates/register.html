<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration – USB Guardian Pro</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-card glass-panel" style="max-width: 500px;">
            <div class="login-header">
                <div class="login-logo" style="border-color: var(--secondary-color); box-shadow: 0 0 15px var(--secondary-glow); color: var(--secondary-color);">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h1 class="login-title">SECURE REGISTRATION</h1>
                <p class="login-subtitle">Create Employee Profile</p>
            </div>
            
            <!-- Flash Message Alerts -->
            <div class="auth-alerts">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                <i class="fas fa-exclamation-circle mr-2"></i> {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            </div>
            
            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="cyber-form-group">
                    <label class="cyber-form-label" for="username">Username / Core Handle</label>
                    <input type="text" id="username" name="username" class="cyber-input" placeholder="e.g. jdoe" required autocomplete="off">
                </div>
                
                <div class="cyber-form-group">
                    <label class="cyber-form-label" for="email">Enterprise Email Address</label>
                    <input type="email" id="email" name="email" class="cyber-input" placeholder="j.doe@company.com" required autocomplete="off">
                </div>
                
                <div class="cyber-form-group">
                    <label class="cyber-form-label" for="department">Assigned Department</label>
                    <select id="department" name="department" class="cyber-input" required style="background-color: var(--bg-color);">
                        <option value="" disabled selected>Select department node</option>
                        <option value="Research & Development">Research & Development</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Human Resources">Human Resources</option>
                        <option value="Financial Operations">Financial Operations</option>
                        <option value="Executive Management">Executive Management</option>
                    </select>
                </div>
                
                <div class="cyber-form-group">
                    <label class="cyber-form-label" for="password">Create Security PIN / Password</label>
                    <input type="password" id="password" name="password" class="cyber-input" placeholder="Minimum 6 symbols" required>
                </div>
                
                <div class="cyber-form-group">
                    <label class="cyber-form-label" for="confirm_password">Verify Security PIN</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="cyber-input" placeholder="Re-enter password" required>
                </div>
                
                <button type="submit" class="cyber-btn btn-secondary">
                    <i class="fas fa-clipboard-check"></i> Register Account
                </button>
            </form>
            
            <div class="login-footer">
                Already registered? <a href="{{ url_for('auth.login') }}" style="color: var(--secondary-color);">Authenticate Portal</a>
            </div>
        </div>
    </div>
    
    <!-- Audio Trigger Activation on Click -->
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
</body>
</html>
